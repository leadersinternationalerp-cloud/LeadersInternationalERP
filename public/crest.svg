<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" role="img" aria-label="Leaders International School crest">
  <defs>
    <path id="arc" d="M16 60 a44 44 0 1 1 88 0" />
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08365e"/>
      <stop offset=".55" stop-color="#002848"/>
      <stop offset="1" stop-color="#01192e"/>
    </linearGradient>
    <linearGradient id="torch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b87904"/>
      <stop offset=".5" stop-color="#fdcb24"/>
      <stop offset="1" stop-color="#9e6402"/>
    </linearGradient>
  </defs>
  <!-- Outer badge -->
  <circle cx="60" cy="58" r="54" fill="url(#navy)"/>
  <circle cx="60" cy="58" r="52.2" fill="none" stroke="#38c0c8" stroke-width="1.8"/>
  <circle cx="60" cy="58" r="35.8" fill="none" stroke="#38c0c8" stroke-width="1.6"/>
  <circle cx="60" cy="58" r="34.4" fill="#ffffff"/>
  <!-- School name on top arc -->
  <text fill="#ffffff" font-family="Poppins, Segoe UI, sans-serif" font-size="8.1" font-weight="800" letter-spacing="1.15">
    <textPath href="#arc" startOffset="50%" text-anchor="middle">LEADERS INTERNATIONAL SCHOOL</textPath>
  </text>
  <!-- Outer stars -->
  <g fill="#38c0c8">
    <polygon points="18,66 19.2,68.5 22,68.9 20,70.8 20.5,73.5 18,72.2 15.5,73.5 16,70.8 14,68.9 16.8,68.5"/>
    <polygon points="102,66 103.2,68.5 106,68.9 104,70.8 104.5,73.5 102,72.2 99.5,73.5 100,70.8 98,68.9 100.8,68.5"/>
    <polygon points="60,99.5 61.5,102.5 64.8,103 62.4,105.3 63,108.5 60,107 57,108.5 57.6,105.3 55.2,103 58.5,102.5"/>
  </g>
  <!-- Cyan laurel wreaths -->
  <g fill="#38c0c8">
    <ellipse cx="33" cy="61" rx="4.2" ry="1.9" transform="rotate(-35 33 61)"/>
    <ellipse cx="31.5" cy="54" rx="4.2" ry="1.9" transform="rotate(-20 31.5 54)"/>
    <ellipse cx="33" cy="47" rx="4.2" ry="1.9" transform="rotate(-5 33 47)"/>
    <ellipse cx="36.5" cy="40.5" rx="4.2" ry="1.9" transform="rotate(15 36.5 40.5)"/>
    <ellipse cx="42" cy="35.5" rx="4" ry="1.8" transform="rotate(30 42 35.5)"/>
    <ellipse cx="87" cy="61" rx="4.2" ry="1.9" transform="rotate(35 87 61)"/>
    <ellipse cx="88.5" cy="54" rx="4.2" ry="1.9" transform="rotate(20 88.5 54)"/>
    <ellipse cx="87" cy="47" rx="4.2" ry="1.9" transform="rotate(5 87 47)"/>
    <ellipse cx="83.5" cy="40.5" rx="4.2" ry="1.9" transform="rotate(-15 83.5 40.5)"/>
    <ellipse cx="78" cy="35.5" rx="4" ry="1.8" transform="rotate(-30 78 35.5)"/>
  </g>
  <!-- 5 Gold stars at top of inner circle -->
  <g fill="#f5b90a">
    <circle cx="51" cy="33" r="1.4"/>
    <circle cx="55" cy="30.5" r="1.8"/>
    <circle cx="60" cy="29" r="2.3"/>
    <circle cx="65" cy="30.5" r="1.8"/>
    <circle cx="69" cy="33" r="1.4"/>
  </g>
  <!-- Torch & flame -->
  <path d="M60 33.5c4.5 5.2 6.8 8.7 6.8 11.8A6.8 6.8 0 0 1 53.2 45.5c0-3.2 2.3-6.7 6.8-12z" fill="#f59e0b"/>
  <path d="M60 38c2.5 3 3.6 5 3.6 6.8a3.6 3.6 0 1 1-7.2 0c0-1.8 1.1-3.8 3.6-6.8z" fill="#fdcb24"/>
  <rect x="54.5" y="47" width="11" height="3.2" rx="1.5" fill="url(#torch)"/>
  <path d="M56.2 50.2h7.6l-2.6 18.5h-2.4z" fill="url(#torch)"/>
  <!-- Open book -->
  <path d="M60 60c-6-3.2-14-3.8-21-2v13.5c7-1.8 15-1.2 21 2 6-3.2 14-3.8 21-2V58c-7-1.8-15-1.2-21 2z" fill="#ffffff" stroke="#002848" stroke-width="1.8"/>
  <path d="M37 72.5c8-1.8 16-1 23 2 7-3 15-3.8 23-2" fill="none" stroke="#002848" stroke-width="2.4"/>
  <path d="M60 60v13.5" stroke="#002848" stroke-width="1.4"/>
  <!-- Light-blue motto ribbon -->
  <path d="M12 88l10-3v11l-10 3 4-5.5zM108 88l-10-3v11l10 3-4-5.5z" fill="#229ca6" stroke="#002848" stroke-width="1.4"/>
  <path d="M20 82c26-5 54-5 80 0l-3 12c-24-4.8-50-4.8-74 0z" fill="#38c0c8" stroke="#002848" stroke-width="1.5"/>
  <text x="60" y="90" text-anchor="middle" fill="#002848" font-family="Poppins, Segoe UI, sans-serif" font-size="4.6" font-weight="800" letter-spacing=".35">
    LEARNING TODAY, LEADING TOMORROW
  </text>
</svg>
