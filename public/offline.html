<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Leaders International School ERP</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      text-align: center;
      max-width: 400px;
      width: 90%;
      border: 1px solid #e2e8f0;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 1.5rem;
      object-fit: contain;
    }
    h1 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      color: #00264b;
    }
    p {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    button {
      background-color: #00264b;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #003870;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="Leaders International School" class="logo" onerror="this.style.display='none'">
    <h1>You are currently offline</h1>
    <p>Please check your internet connection and try again to continue using Leaders International ERP.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
